apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:97d5d7d2b5731c48d9d300dceddadb6844be3626

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

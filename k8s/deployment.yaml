apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:28220e0bef5ec3b1ebb39d5ecb0693f14ea1cc87

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:380c6c978bf648f9adab22a77f41fb561c49d046

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

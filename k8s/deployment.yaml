apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:0ce10e0ca5445b181c486aefa91bb40fee273009

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

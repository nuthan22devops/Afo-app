apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:d964e8e76b43d44dac410b2ee5a42f768d24a4b5

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

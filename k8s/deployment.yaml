apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:38f68ba41f7caaff32399b4fdb737deab9913f92

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

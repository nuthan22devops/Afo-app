apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:371ec3aaa3b0f2d6afff395a760c0e0cf452b660

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

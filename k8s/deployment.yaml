apiVersion: apps/v1
kind: Deployment

metadata:
  name: afo-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: afo-backend

  template:
    metadata:
      labels:
        app: afo-backend

    spec:
      containers:
      - name: afo-backend

        image: nuthan22/my-app:4a3b3fcd3981dd4720ffd61ce4f4146ed76b4e8d

        imagePullPolicy: Always

        ports:
        - containerPort: 3000
